services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Not exposed on the host (no top-level "ports:" for postgres) — same
    # zero-trust reasoning as the old TP-review project's own compose file:
    # if only SSH is open externally on the real server, publishing 5432
    # does nothing for outside access and just adds unused attack surface.
    # Tunnel over SSH if psql access is ever needed:
    #   ssh -L 5432:localhost:5432 <user>@<server>
    volumes:
      - session_notes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Pulled from Docker Hub — the server never needs the repo source at
    # all for this service. Confirmed real (2026-10-15): krishna0051/
    # session-notes-backend is a genuine, already-pushed Docker Hub repo —
    # verified directly via `docker pull` + real content inspection, not
    # just a naming placeholder anymore.
    image: krishna0051/session-notes-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      UPLOAD_STORAGE_DIR: /app/data/uploads
      # Fix Round (2026-10-05), "structural gate for the debug-script
      # incident": every real call site in agent-making now refuses to run
      # unless this is explicitly "1" — see agent-making/agent/pipeline/
      # real_api_guard.py. This deployed backend IS the real, intentional
      # "serves real reviews" process, so it sets this itself; a bare
      # script run by hand anywhere else does NOT get this for free.
      ALLOW_REAL_API_CALLS: "1"
      # Explicit here (2026-10-05 pre-deploy review), not left to silently
      # fall back to app/config.py's own code defaults — a real production
      # deploy should state its real-money ceilings in the deploy config
      # itself, visible without reading the source. Values match the
      # code's own current defaults; change here (not in config.py) to
      # adjust real production spend limits without a rebuild.
      # PER_DOCUMENT_HARD_CAP_USD is the per-classified-set hard cap (one
      # person's one session note + its matched activity/supporting data)
      # — lowered from $2.00 to $1.40 this round, reconciled to be the
      # ONE number for this unit (see app/config.py's own docstring).
      PER_DOCUMENT_HARD_CAP_USD: "1.40"
      # Raised 2026-10-15 to $35.00 (Krishna's explicit choice, matching
      # staging's own cap rather than the more conservative $25 originally
      # suggested for production specifically) — grounded in the same real
      # per-document data: 16+ real completed reviews averaging $0.14-0.19/
      # doc, worst case $0.205/doc seen so far. At $35 and the worst real
      # per-doc rate, a batch stops itself after ~170 documents — covers
      # the full real 184-document Mrs. Ungar batch with a bit of room to
      # spare. See app/config.py's batch_max_spend_usd docstring for the
      # full real-data history behind this number.
      BATCH_MAX_SPEND_USD: "35.00"
      RULE_ENGINE_MAX_SPEND_USD: "4.00"
      # Real Postgres/Anthropic/OpenRouter secrets are deliberately NOT set
      # here — they live only in the .env file sitting next to this
      # compose file on the server, which is never committed to git.
    ports:
      # 8006, not a fresh/distinct port: this host's Cloudflare Tunnel for
      # sn.masterfaster.org is already configured pointing at
      # localhost:8006 (path ^/api) — production is aligned to match that
      # existing tunnel config rather than reconfiguring Cloudflare.
      # CONSEQUENCE: there is no separate remote server — production and
      # docker-compose.staging.yml run on this SAME machine, and staging
      # ALSO binds 8006 — the two stacks can never run at the same time.
      # Stop staging first:
      #   docker compose -f docker-compose.staging.yml -p session-notes-staging down
      - "8006:8000"
    volumes:
      - session_notes_uploads_data:/app/data/uploads
      # Not yet written by anything real (session_note_extraction.py isn't
      # wired into a real call site yet — see backend Phase 3's own
      # report) — mounted now so the moment it is, a restart can't
      # silently re-trigger billed calls for files already processed.
      - session_notes_session_note_cache:/agent-making/agent/.cache/session_note_extractions

  frontend:
    # Pulled from Docker Hub — IMPORTANT: this image must be (re)built
    # locally with the real production VITE_API_BASE_URL baked in via
    # --build-arg BEFORE pushing (see frontend/Dockerfile's own comment):
    #   docker build --build-arg VITE_API_BASE_URL=https://sn.masterfaster.org/api \
    #     -f frontend/Dockerfile -t krishna0051/session-notes-frontend:latest .
    # Changing this compose file alone does nothing — Vite bakes the value
    # in at `docker build` time, not container start.
    # CONFIRMED (2026-10-05 pre-deploy review, this comment was stale and
    # WRONG as of an earlier phase): app/main.py DOES mount every router
    # under API_PREFIX = "/api" — this value is correct as written. Verify
    # with: curl https://sn.masterfaster.org/api/rules after deploying.
    image: krishna0051/session-notes-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 3006, matching the already-configured Cloudflare Tunnel for
      # sn.masterfaster.org (catch-all route -> localhost:3006) — same
      # reasoning as the backend service's own 8006 above. This is also
      # docker-compose.staging.yml's own frontend port, so the two stacks
      # can never run at the same time on this one machine; stop staging
      # first (see the backend service's own comment for the command).
      - "3006:80"

volumes:
  session_notes_postgres_data:
  session_notes_uploads_data:
  session_notes_session_note_cache:
