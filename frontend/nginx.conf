server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path nginx can't find as a real static file (every
    # client-side route) falls back to index.html so TanStack Router's
    # own file-based routing handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # BUG FIX: leaving index.html with NO Cache-Control header at all (the
    # previous state here) does NOT mean "never cached" — with no header,
    # browsers apply their own heuristic freshness (RFC 7234 §4.2.2) and
    # can serve a locally-cached copy of index.html WITHOUT even asking
    # the server, for a real window of time. Since every deploy replaces
    # dist/assets/ wholesale (Vite's content-hashed filenames change, old
    # ones are deleted, never left in place), a stale cached index.html
    # references JS bundle URLs that 404 on the CURRENT server — a real,
    # reproduced incident (Krishna hit exactly this: our own server-side
    # rebuild+redeploy was verified correct and NOT stale, but his
    # browser's own cached index.html from an earlier deploy was). "no-cache"
    # (NOT "no-store") is the fix: the browser still keeps a local copy but
    # MUST revalidate with the server (a cheap conditional GET, usually a
    # 304) before ever using it, so a real new deploy is always picked up
    # on the very next load, cheaply.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed asset filenames (Vite's own build output convention) are safe
    # to cache aggressively — a given hash's content never changes, so no
    # revalidation is ever needed for these specifically.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
