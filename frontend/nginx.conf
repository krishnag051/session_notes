server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path nginx can't find as a real static file (every
    # client-side route) falls back to index.html so TanStack Router's
    # own file-based routing handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's own build output convention) are safe
    # to cache aggressively; index.html itself is deliberately NOT covered
    # by this block, so a new deploy is picked up on next load rather than
    # served stale from a browser cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
